{% extends "base.html" %}
{% block conteudo %}
<h2>Editar gasto</h2>
<form class="form vertical" method="post">
    <label>Descrição <input name="descricao" value="{{ gasto.descricao }}" required></label>
    <label>Valor <input name="valor" type="number" step="0.01" min="0.01" value="{{ gasto.valor }}" required></label>
    <label>Categoria
        <select name="categoria">
            {% for c in categorias %}
                <option {% if c == gasto.categoria %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Data <input name="data" type="date" value="{{ gasto.data.isoformat() }}"></label>
    <div class="botoes">
        <button>Salvar</button>
        <a href="/">Cancelar</a>
    </div>
</form>
{% endblock %}
