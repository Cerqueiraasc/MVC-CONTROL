{% extends "base.html" %}
{% block conteudo %}
<section class="edicao">
    <a class="voltar" href="/">← Voltar para os gastos</a>
    <h1>Editar gasto</h1>
    <form class="form" method="post">
        <label class="campo-valor">Valor em reais <input name="valor" type="number" step="0.01" min="0.01" value="{{ '%.2f'|format(gasto.valor) }}" required></label>
        <label>Descrição <input name="descricao" value="{{ gasto.descricao }}" maxlength="120" required></label>
        <div class="duas-colunas">
            <label>Categoria
                <select name="categoria">
                    {% for c in categorias %}
                        <option {% if c == gasto.categoria %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>Data <input name="data" type="date" value="{{ gasto.data.isoformat() }}"></label>
        </div>
        <div class="botoes">
            <button>Salvar alterações</button>
            <a class="botao-secundario" href="/">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
